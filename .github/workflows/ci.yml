name: CI

on:
  push:
  pull_request:

jobs:
  skill:
    # Repository checks: the skill folder follows the Agent Skills spec.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Validate skill against the Agent Skills spec
        run: uvx --from skills-ref==0.1.1 agentskills validate plugin/skills/compbio-tutor

  lint-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::lintr, any::cyclocomp
          dependencies: '"hard"'
          install-pandoc: false
      - name: lintr
        run: Rscript -e 'l <- lintr::lint_dir("."); print(l); quit(status = length(l) > 0)'

  r:
    # The tutor and the graders run in the student's own R, on any OS, from
    # the oldest supported R (4.3) to the newest.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release]
        include:
          - os: ubuntu-latest
            r: "4.3"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Linux libraries some Bioconductor packages build against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: CLI smoke test from a fresh course folder (base R only)
        run: |
          mkdir -p "$RUNNER_TEMP/compbio" && cd "$RUNNER_TEMP/compbio"
          T="$GITHUB_WORKSPACE/plugin/bin/compbio-tutor"
          "$T" list
          "$T" show t1-revcomp
          test -f data/t1-revcomp.fasta && test -f work/t1-revcomp.R
          "$T" grade t1-revcomp --answer ACGT | grep '"status": "incorrect"'
          "$T" hint t1-revcomp | grep 'Hint 1 of 3'
          "$T" explain t1-revcomp | grep 'Not yet'
          { "$T" run work/t1-revcomp.R 2>&1 || true; } | grep -i 'error' # starter has blanks
          { "$T" run ../outside.R || true; } | grep 'inside the course folder'
          "$T" doctor
      - name: The launcher finds R without R on PATH
        run: |
          cd "$RUNNER_TEMP/compbio"
          env PATH="/usr/bin:/bin" "$GITHUB_WORKSPACE/plugin/bin/compbio-tutor" list | grep t1-gc-content
      - name: Install lesson packages the way students do
        run: |
          cd "$RUNNER_TEMP/compbio"
          "$GITHUB_WORKSPACE/plugin/bin/compbio-tutor" doctor --install-packages | tee doctor.txt
          grep 'Everything is ready' doctor.txt
          # The course .Rprofile points R at the packages inside the folder.
          Rscript -e 'library(Biostrings); stopifnot(grepl("compbio", .libPaths()[1]))'
      - name: Install test packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat, any::withr
          dependencies: '"hard"'
          install-pandoc: false
      - name: testthat
        # Use the Biostrings that the student-style install put in the course library.
        run: |
          export R_LIBS="$RUNNER_TEMP/compbio/.compbio-tutor/library"
          Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
